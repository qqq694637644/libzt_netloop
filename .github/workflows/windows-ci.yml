name: Windows CI

on:
  push:
    branches:
      - main
      - "gpt/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  BUILD_ARTIFACT: windows-build-${{ github.run_id }}-${{ github.run_attempt }}
  RENDEZVOUS_ARTIFACT: zt-rendezvous-${{ github.run_id }}-${{ github.run_attempt }}
  CLIENT_RESULT_ARTIFACT: zt-client-result-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with Python
        run: python tools/build.py --config Release
      - name: Smoke test with Python
        run: python ci/smoke.py --runtime dist
      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/build/
          if-no-files-found: warn
          retention-days: 14

  e2e-server:
    name: E2E machine A (home/server)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: package
      - name: Deploy binaries with Python
        run: python ci/deploy.py --source package --destination runtime
      - name: Join ad-hoc network and prepare home endpoint
        run: python ci/e2e_server.py prepare --runtime runtime
      - name: Publish rendezvous
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RENDEZVOUS_ARTIFACT }}
          path: evidence/server/rendezvous.json
          if-no-files-found: error
          retention-days: 2
      - name: Hold server until client finishes
        run: python ci/e2e_server.py hold --client-artifact "${{ env.CLIENT_RESULT_ARTIFACT }}"
      - name: Preserve server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/server/
          if-no-files-found: warn
          retention-days: 14

  e2e-client:
    name: E2E machine B (laptop/client)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: package
      - name: Deploy binaries with Python
        run: python ci/deploy.py --source package --destination runtime
      - name: Join network, cross-machine tunnel, and egress test
        id: e2e
        continue-on-error: true
        run: python ci/e2e_client.py --runtime runtime --rendezvous-artifact "${{ env.RENDEZVOUS_ARTIFACT }}"
      - name: Publish client result for machine A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLIENT_RESULT_ARTIFACT }}
          path: evidence/client/result.json
          if-no-files-found: error
          retention-days: 2
      - name: Preserve client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/client/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail job when E2E failed
        if: steps.e2e.outcome != 'success'
        run: python -c "raise SystemExit('cross-machine E2E failed; inspect client/server evidence artifacts')"
