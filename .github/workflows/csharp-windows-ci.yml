name: C# Windows CI

on:
  push:
    branches:
      - main
      - "gpt/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: csharp-windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: "libzt-netloop-csharp-windows-msvc-v1"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  BUILD_ARTIFACT: csharp-windows-build-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Build C# Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve native cache key
        id: native-key
        shell: pwsh
        run: |
          $fingerprint = python tools/native_cache_key.py --platform windows --arch x64
          if ($LASTEXITCODE -ne 0) { throw 'Failed to hash native cache inputs' }
          "key=libzt-pinvoke-win-x64-$fingerprint" >> $env:GITHUB_OUTPUT

      - name: Restore compiled libzt bundle
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native-cache
          key: ${{ steps.native-key.outputs.key }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Build native libzt on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: >
          python tools/build_csharp.py
          --native-only
          --use-sccache
          --native-output native-cache/libzt.dll

      - name: Verify native bundle
        shell: pwsh
        run: |
          if (-not (Test-Path native-cache/libzt.dll)) {
            throw "native-cache/libzt.dll is missing"
          }
          if (-not (Test-Path native-cache/libzt.dll.manifest.json)) {
            throw "Native library manifest is missing"
          }
          Get-Content native-cache/libzt.dll.manifest.json

      - name: Validate native underlay trace ABI (no Node start)
        run: python ci/test_native_underlay_trace.py native-cache/libzt.dll

      - name: Test native stale-socket fallback, DAD and Root ACK policy
        shell: pwsh
        run: |
          # A cached DLL need not have initialized source submodules.
          # Replaying the pinned Core patch makes the test use production policy.
          python -c "import sys; sys.path.insert(0, 'tools'); import build_csharp as b; b.ensure_submodules(); b.apply_zerotierone_patches()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl.exe /nologo /std:c++17 /EHsc /W4 /Fe:native-handover-policy.exe ci/test_native_handover_policy.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native-handover-policy.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save compiled libzt bundle immediately
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-cache
          key: ${{ steps.native-key.outputs.key }}

      - name: Restore and publish managed host
        run: >
          python tools/build_csharp.py
          --managed-only
          --native-input native-cache/libzt.dll
          --output dist-csharp
          --runtime win-x64

      - name: Run deterministic offline C# regressions
        run: dotnet run --project src-csharp/NetLoop.Checks/NetLoop.Checks.csproj --configuration Release

      - name: Run offline Python probe and handover comparison regressions
        run: python -m unittest discover -s ci -p "test_*.py"

      - name: Upload C# runtime
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: dist-csharp/
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          "### C# build" >> $env:GITHUB_STEP_SUMMARY
          "- native bundle cache hit: ${{ steps.native-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path dist-csharp/build-manifest.json) {
            Get-Content dist-csharp/build-manifest.json >> $env:GITHUB_STEP_SUMMARY
          }
