name: Release Windows EXEs

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or ref to build
        required: true
        default: main
        type: string
      version:
        description: Release version, for example 0.2.0 or v0.2.0
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: "libzt-netloop-windows-msvc-v1"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  release:
    name: Build and publish Windows EXEs
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Build selected version
        run: python tools/build.py --config Release --generator ninja --use-sccache --version "${{ inputs.version }}"

      - name: Smoke test binaries
        run: python ci/smoke.py --runtime dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: python tools/release.py --version "${{ inputs.version }}" --dist-dir dist
