name: C# Windows and Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string
      publish_windows:
        description: "Publish Windows x64"
        required: true
        type: boolean
        default: true
      publish_android:
        description: "Publish Android arm64-v8a"
        required: true
        type: boolean
        default: true

concurrency:
  group: csharp-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  PYTHONUTF8: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  metadata:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - name: Validate and resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_WINDOWS: ${{ inputs.publish_windows }}
          PUBLISH_ANDROID: ${{ inputs.publish_android }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_WINDOWS" != "true" && "$PUBLISH_ANDROID" != "true" ]]; then
            echo "Select at least one platform to publish." >&2
            exit 1
          fi
          if [[ "$REQUESTED_VERSION" =~ ^v?((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            version="${BASH_REMATCH[1]}"
            major="${BASH_REMATCH[2]}"
            minor="${BASH_REMATCH[3]}"
            patch="${BASH_REMATCH[4]}"
          else
            echo "Version must look like MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          android_version_code=1
          if [[ "$PUBLISH_ANDROID" == "true" ]]; then
            if (( ${#major} > 4 || ${#minor} > 3 || ${#patch} > 3 )); then
              echo "Android version requires major <= 2100 and minor/patch < 1000." >&2
              exit 1
            fi
            android_version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
            if (( android_version_code < 1 || android_version_code > 2100000000 )); then
              echo "Android versionCode is out of range: $android_version_code" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"
          echo "Release tag: v$version"
          echo "Windows: $PUBLISH_WINDOWS"
          echo "Android: $PUBLISH_ANDROID"

  windows:
    name: Release Windows x64 (split self-contained build)
    if: ${{ inputs.publish_windows }}
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SCCACHE_GHA_VERSION: libzt-netloop-release-windows-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve native cache key
        id: native-key
        shell: pwsh
        run: |
          $libzt = (git ls-tree HEAD external/libzt).Split()[2]
          $cmake = git hash-object CMakeLists.txt
          $script = git hash-object tools/build_csharp.py
          $patch = git hash-object patches/libzt/0001-host-network-change-refresh.patch
          "key=libzt-pinvoke-win-x64-$libzt-$cmake-$script-$patch" >> $env:GITHUB_OUTPUT

      - name: Restore compiled libzt bundle
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native-cache
          key: ${{ steps.native-key.outputs.key }}

      - name: Set up MSVC environment
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Build native libzt on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: >
          python tools/build_csharp.py
          --native-only
          --use-sccache
          --native-output native-cache/libzt.dll

      - name: Verify native bundle
        shell: pwsh
        run: |
          if (-not (Test-Path native-cache/libzt.dll)) {
            throw "native-cache/libzt.dll is missing"
          }

      - name: Save compiled libzt bundle
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-cache
          key: ${{ steps.native-key.outputs.key }}

      - name: Publish self-contained Windows app
        run: >
          python tools/build_csharp.py
          --managed-only
          --native-input native-cache/libzt.dll
          --output dist-csharp
          --runtime win-x64
          --self-contained
          --version "${{ needs.metadata.outputs.version }}"

      - name: Smoke test
        run: >
          python ci/csharp_smoke.py
          --runtime dist-csharp
          --expected-version "${{ needs.metadata.outputs.version }}"

      - name: Verify self-contained publish
        shell: pwsh
        run: |
          foreach ($name in @('netloop.exe', 'netloop.dll', 'libzt.dll',
              'netloop.deps.json', 'netloop.runtimeconfig.json',
              'coreclr.dll', 'hostpolicy.dll')) {
            if (-not (Test-Path "dist-csharp/$name")) {
              throw "Required self-contained publish file missing: $name"
            }
          }
          $manifest = Get-Content dist-csharp/build-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.self_contained -ne $true) {
            throw "Windows release must be self-contained"
          }

      - name: Split self-contained publish into app and runtime zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $source = (Resolve-Path 'dist-csharp').Path
          $files = @(Get-ChildItem -LiteralPath $source -Recurse -File |
            Where-Object { $_.Extension -ne '.pdb' -and $_.Name -ne 'build-manifest.json' })

          # NetLoop-owned binaries go in the small app zip. Everything else from this
          # same publish goes in the runtime zip, including deps/runtimeconfig JSON.
          $appNames = @('netloop.exe', 'netloop.dll', 'libzt.dll',
            'NetLoop.Core.dll', 'NetLoop.Libzt.dll', 'NetLoop.Socks.dll')
          $appFiles = @($files | Where-Object { $_.Name -in $appNames })
          $runtimeFiles = @($files | Where-Object { $_.Name -notin $appNames })
          foreach ($name in $appNames) {
            if ($name -notin $appFiles.Name) {
              throw "Missing application binary: $name"
            }
          }
          foreach ($name in @('coreclr.dll', 'hostpolicy.dll',
              'netloop.deps.json', 'netloop.runtimeconfig.json')) {
            if ($name -notin $runtimeFiles.Name) {
              throw "Missing runtime file: $name"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.ZipFile
          $packages = @(
            @{ Name = 'netloop-win-x64.zip'; Files = $appFiles },
            @{ Name = 'netloop-dotnet-runtime-win-x64.zip'; Files = $runtimeFiles }
          )
          foreach ($package in $packages) {
            $zip = Join-Path (Get-Location) "release/$($package.Name)"
            $archive = [System.IO.Compression.ZipFile]::Open(
              $zip, [System.IO.Compression.ZipArchiveMode]::Create)
            try {
              foreach ($file in $package.Files) {
                $entry = [System.IO.Path]::GetRelativePath($source, $file.FullName).Replace('\', '/')
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                  $archive, $file.FullName, $entry, [System.IO.Compression.CompressionLevel]::Optimal
                ) | Out-Null
              }
            }
            finally {
              $archive.Dispose()
            }
            Write-Output "$($package.Name): $($package.Files.Count) files"
          }

      - name: Smoke test both zips in the same directory
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'netloop-release-zip-smoke'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          Expand-Archive -LiteralPath 'release/netloop-dotnet-runtime-win-x64.zip' -DestinationPath $testRoot -Force
          Expand-Archive -LiteralPath 'release/netloop-win-x64.zip' -DestinationPath $testRoot -Force
          foreach ($name in @('netloop.exe', 'libzt.dll', 'coreclr.dll',
              'hostpolicy.dll', 'netloop.deps.json', 'netloop.runtimeconfig.json')) {
            if (-not (Test-Path (Join-Path $testRoot $name))) {
              throw "Missing file after merging archives: $name"
            }
          }
          python ci/csharp_smoke.py --runtime $testRoot --expected-version "${{ needs.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: |
            release/netloop-win-x64.zip
            release/netloop-dotnet-runtime-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Release Android arm64-v8a
    if: ${{ inputs.publish_android }}
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCCACHE_GHA_VERSION: libzt-netloop-release-android-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          workloads: android

      - name: Resolve Android native cache key
        id: native-key
        shell: bash
        run: |
          set -euo pipefail
          libzt="$(git ls-tree HEAD external/libzt | awk '{print $3}')"
          cmake="$(git hash-object CMakeLists.txt)"
          script="$(git hash-object tools/build_android_native.py)"
          patch1="$(git hash-object patches/libzt/0001-host-network-change-refresh.patch)"
          patch2="$(git hash-object patches/libzt/0002-android-pinvoke.patch)"
          ndk_revision="$(awk -F= '/Pkg.Revision/ {gsub(/ /, "", $2); print $2}' "$ANDROID_NDK_HOME/source.properties")"
          echo "key=libzt-pinvoke-android-arm64-${ndk_revision}-${libzt}-${cmake}-${script}-${patch1}-${patch2}" >> "$GITHUB_OUTPUT"

      - name: Restore compiled Android libzt bundle
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native-cache/android-arm64
          key: ${{ steps.native-key.outputs.key }}

      - name: Set up sccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Build Android arm64-v8a libzt on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: >
          python tools/build_android_native.py
          --ndk "$ANDROID_NDK_HOME"
          --api 24
          --abi arm64-v8a
          --use-sccache
          --output native-cache/android-arm64/libzt.so

      - name: Verify Android native bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f native-cache/android-arm64/libzt.so
          file native-cache/android-arm64/libzt.so | tee native-cache/android-arm64/file.txt
          grep -Eq 'ARM aarch64|ARM64|AArch64' native-cache/android-arm64/file.txt

      - name: Save compiled Android libzt bundle
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-cache/android-arm64
          key: ${{ steps.native-key.outputs.key }}

      - name: Publish Android application
        run: >
          dotnet publish src-csharp/NetLoop.Android/NetLoop.Android.csproj
          --configuration Release
          --framework net10.0-android36.0
          --runtime android-arm64
          -p:LibztNativePath="$PWD/native-cache/android-arm64/libzt.so"
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion="${{ needs.metadata.outputs.version }}"
          -p:ApplicationVersion="${{ needs.metadata.outputs.android_version_code }}"

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="$(find src-csharp/NetLoop.Android/bin/Release/net10.0-android36.0/android-arm64 -type f -name '*-Signed.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            apk="$(find src-csharp/NetLoop.Android/bin/Release/net10.0-android36.0/android-arm64 -type f -name '*.apk' -print -quit)"
          fi
          test -n "$apk"
          cp "$apk" release/netloop-android-arm64.apk
          unzip -Z1 "$apk" | tee release/apk-contents.txt
          grep -q '^lib/arm64-v8a/libzt.so$' release/apk-contents.txt
          abis="$(awk -F/ '$1 == "lib" {print $2}' release/apk-contents.txt | sort -u | paste -sd, -)"
          test "$abis" = "arm64-v8a"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: release/netloop-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [metadata, windows, android]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && (!inputs.publish_windows || needs.windows.result == 'success') && (!inputs.publish_android || needs.android.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi
          ls -lh "${assets[@]}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --generate-notes --title "$RELEASE_TAG" --target "$GITHUB_SHA"
          fi
