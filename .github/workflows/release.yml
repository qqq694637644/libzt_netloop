name: C# Windows and Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string
      publish_windows:
        description: "Publish Windows x64"
        required: true
        type: boolean
        default: true
      publish_android:
        description: "Publish Android arm64-v8a"
        required: true
        type: boolean
        default: true

concurrency:
  group: csharp-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  PYTHONUTF8: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  metadata:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - name: Validate and resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_WINDOWS: ${{ inputs.publish_windows }}
          PUBLISH_ANDROID: ${{ inputs.publish_android }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_WINDOWS" != "true" && "$PUBLISH_ANDROID" != "true" ]]; then
            echo "Select at least one platform to publish." >&2
            exit 1
          fi
          if [[ "$REQUESTED_VERSION" =~ ^v?((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            version="${BASH_REMATCH[1]}"
            major="${BASH_REMATCH[2]}"
            minor="${BASH_REMATCH[3]}"
            patch="${BASH_REMATCH[4]}"
          else
            echo "Version must look like MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          android_version_code=1
          if [[ "$PUBLISH_ANDROID" == "true" ]]; then
            if (( ${#major} > 4 || ${#minor} > 3 || ${#patch} > 3 )); then
              echo "Android version requires major <= 2100 and minor/patch < 1000." >&2
              exit 1
            fi
            android_version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
            if (( android_version_code < 1 || android_version_code > 2100000000 )); then
              echo "Android versionCode is out of range: $android_version_code" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"
          echo "Release tag: v$version"
          echo "Windows: $PUBLISH_WINDOWS"
          echo "Android: $PUBLISH_ANDROID"

  windows:
    name: Release Windows x64 (app + portable .NET runtime)
    if: ${{ inputs.publish_windows }}
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SCCACHE_GHA_VERSION: libzt-netloop-release-windows-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve native cache key
        id: native-key
        shell: pwsh
        run: |
          $libzt = (git ls-tree HEAD external/libzt).Split()[2]
          $cmake = git hash-object CMakeLists.txt
          $script = git hash-object tools/build_csharp.py
          $patch = git hash-object patches/libzt/0001-host-network-change-refresh.patch
          "key=libzt-pinvoke-win-x64-$libzt-$cmake-$script-$patch" >> $env:GITHUB_OUTPUT

      - name: Restore compiled libzt bundle
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native-cache
          key: ${{ steps.native-key.outputs.key }}

      - name: Set up MSVC environment
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Build native libzt on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: >
          python tools/build_csharp.py
          --native-only
          --use-sccache
          --native-output native-cache/libzt.dll

      - name: Verify native bundle
        shell: pwsh
        run: |
          if (-not (Test-Path native-cache/libzt.dll)) {
            throw "native-cache/libzt.dll is missing"
          }

      - name: Save compiled libzt bundle
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-cache
          key: ${{ steps.native-key.outputs.key }}

      - name: Publish framework-dependent single-file Windows app
        run: >
          python tools/build_csharp.py
          --managed-only
          --native-input native-cache/libzt.dll
          --output dist-csharp
          --runtime win-x64
          --single-file
          --version "${{ needs.metadata.outputs.version }}"

      - name: Smoke test
        run: >
          python ci/csharp_smoke.py
          --runtime dist-csharp
          --expected-version "${{ needs.metadata.outputs.version }}"

      - name: Verify framework-dependent package
        shell: pwsh
        run: |
          foreach ($name in @('netloop.exe', 'libzt.dll')) {
            if (-not (Test-Path "dist-csharp/$name")) {
              throw "Required Windows release file missing: $name"
            }
          }
          foreach ($name in @('coreclr.dll', 'hostfxr.dll', 'hostpolicy.dll', 'clrjit.dll')) {
            if (Test-Path "dist-csharp/$name") {
              throw "Windows release unexpectedly contains .NET runtime file: $name"
            }
          }
          $manifest = Get-Content dist-csharp/build-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.self_contained -ne $false) {
            throw "Windows release must be framework-dependent"
          }
          if ($manifest.single_file -ne $true) {
            throw "Windows release must embed .NET app metadata in the single-file executable"
          }

      - name: Package exe and dll files only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $files = @(Get-ChildItem -Path dist-csharp -File | Where-Object { $_.Extension -in @('.exe', '.dll') })
          foreach ($required in @('netloop.exe', 'libzt.dll')) {
            if ($required -notin $files.Name) {
              throw "Required release file missing: $required"
            }
          }
          $zip = Join-Path (Get-Location) 'release/netloop-win-x64.zip'
          Compress-Archive -LiteralPath $files.FullName -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.ZipFile
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if (@($names | Where-Object { [IO.Path]::GetExtension($_) -notin @('.exe', '.dll') }).Count -gt 0) {
              throw "Windows release zip contains files other than exe/dll: $($names -join ', ')"
            }
            foreach ($required in @('netloop.exe', 'libzt.dll')) {
              if ($required -notin $names) {
                throw "Windows release zip is missing: $required"
              }
            }
            Write-Output "Windows release zip contents: $($names -join ', ')"
          }
          finally {
            $archive.Dispose()
          }

      - name: Package portable .NET 10 x64 runtime separately
        shell: pwsh
        run: |
          $runtimeCandidates = @(
            dotnet --list-runtimes | ForEach-Object {
              if ($_ -match '^Microsoft\.NETCore\.App (10\.\d+\.\d+) \[(.+)\]$') {
                [pscustomobject]@{
                  Version = [version]$Matches[1]
                  Name = $Matches[1]
                  SharedPath = $Matches[2]
                }
              }
            }
          )
          if ($LASTEXITCODE -ne 0 -or $runtimeCandidates.Count -eq 0) {
            throw ".NET 10 x64 runtime not available on the Windows build runner"
          }

          $selected = $runtimeCandidates | Sort-Object Version -Descending | Select-Object -First 1
          $dotnetRoot = Split-Path -Parent (Split-Path -Parent $selected.SharedPath)
          $runtimeSource = Join-Path $selected.SharedPath $selected.Name
          $hostFxr = @(Get-ChildItem -LiteralPath (Join-Path $dotnetRoot 'host/fxr') -Directory |
            Where-Object { $_.Name -match '^10\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1)
          if ($hostFxr.Count -ne 1 -or -not (Test-Path (Join-Path $dotnetRoot 'dotnet.exe')) -or -not (Test-Path $runtimeSource)) {
            throw "Cannot locate the .NET 10 host, hostfxr, and runtime files"
          }

          $stage = Join-Path $env:RUNNER_TEMP 'netloop-portable-dotnet'
          $sharedDestination = Join-Path $stage 'shared/Microsoft.NETCore.App'
          $fxrDestination = Join-Path $stage 'host/fxr'
          New-Item -ItemType Directory -Path @($sharedDestination, $fxrDestination) -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $dotnetRoot 'dotnet.exe') -Destination $stage
          Copy-Item -LiteralPath $runtimeSource -Destination $sharedDestination -Recurse
          Copy-Item -LiteralPath $hostFxr[0].FullName -Destination $fxrDestination -Recurse
          foreach ($notice in @('LICENSE.txt', 'ThirdPartyNotices.txt')) {
            $source = Join-Path $dotnetRoot $notice
            if (Test-Path $source) {
              Copy-Item -LiteralPath $source -Destination $stage
            }
          }

          $portableRuntimes = & (Join-Path $stage 'dotnet.exe') --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($portableRuntimes | Where-Object { $_ -match "^Microsoft\.NETCore\.App $([regex]::Escape($selected.Name)) " })) {
            throw "The staged portable .NET runtime failed its startup check"
          }

          $zip = Join-Path (Get-Location) 'release/netloop-dotnet-runtime-win-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) {
            throw "Portable .NET runtime archive was not created"
          }
          Write-Output "Packed portable .NET $($selected.Name) x64 runtime separately: $zip"

      - name: Smoke test extracted application and runtime zips
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'netloop-release-zip-smoke'
          $app = Join-Path $testRoot 'app'
          $runtime = Join-Path $testRoot 'dotnet'
          Expand-Archive -LiteralPath 'release/netloop-win-x64.zip' -DestinationPath $app -Force
          Expand-Archive -LiteralPath 'release/netloop-dotnet-runtime-win-x64.zip' -DestinationPath $runtime -Force
          $portableRuntimes = & (Join-Path $runtime 'dotnet.exe') --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($portableRuntimes | Where-Object { $_ -match '^Microsoft\.NETCore\.App 10\.' })) {
            throw "Extracted portable .NET 10 runtime cannot start"
          }
          $previousDotnetRoot = $env:DOTNET_ROOT_X64
          try {
            $env:DOTNET_ROOT_X64 = $runtime
            $actualVersion = (& (Join-Path $app 'netloop.exe') --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualVersion -ne 'netloop ${{ needs.metadata.outputs.version }}') {
              throw "Extracted app failed to run with portable runtime: $actualVersion"
            }
            Write-Output "Extracted Windows app and portable runtime work together: $actualVersion"
          }
          finally {
            $env:DOTNET_ROOT_X64 = $previousDotnetRoot
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: |
            release/netloop-win-x64.zip
            release/netloop-dotnet-runtime-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Release Android arm64-v8a
    if: ${{ inputs.publish_android }}
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCCACHE_GHA_VERSION: libzt-netloop-release-android-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          workloads: android

      - name: Resolve Android native cache key
        id: native-key
        shell: bash
        run: |
          set -euo pipefail
          libzt="$(git ls-tree HEAD external/libzt | awk '{print $3}')"
          cmake="$(git hash-object CMakeLists.txt)"
          script="$(git hash-object tools/build_android_native.py)"
          patch1="$(git hash-object patches/libzt/0001-host-network-change-refresh.patch)"
          patch2="$(git hash-object patches/libzt/0002-android-pinvoke.patch)"
          ndk_revision="$(awk -F= '/Pkg.Revision/ {gsub(/ /, "", $2); print $2}' "$ANDROID_NDK_HOME/source.properties")"
          echo "key=libzt-pinvoke-android-arm64-${ndk_revision}-${libzt}-${cmake}-${script}-${patch1}-${patch2}" >> "$GITHUB_OUTPUT"

      - name: Restore compiled Android libzt bundle
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native-cache/android-arm64
          key: ${{ steps.native-key.outputs.key }}

      - name: Set up sccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Build Android arm64-v8a libzt on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: >
          python tools/build_android_native.py
          --ndk "$ANDROID_NDK_HOME"
          --api 24
          --abi arm64-v8a
          --use-sccache
          --output native-cache/android-arm64/libzt.so

      - name: Verify Android native bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f native-cache/android-arm64/libzt.so
          file native-cache/android-arm64/libzt.so | tee native-cache/android-arm64/file.txt
          grep -Eq 'ARM aarch64|ARM64|AArch64' native-cache/android-arm64/file.txt

      - name: Save compiled Android libzt bundle
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-cache/android-arm64
          key: ${{ steps.native-key.outputs.key }}

      - name: Publish Android application
        run: >
          dotnet publish src-csharp/NetLoop.Android/NetLoop.Android.csproj
          --configuration Release
          --framework net10.0-android36.0
          --runtime android-arm64
          -p:LibztNativePath="$PWD/native-cache/android-arm64/libzt.so"
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion="${{ needs.metadata.outputs.version }}"
          -p:ApplicationVersion="${{ needs.metadata.outputs.android_version_code }}"

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk="$(find src-csharp/NetLoop.Android/bin/Release/net10.0-android36.0/android-arm64 -type f -name '*-Signed.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            apk="$(find src-csharp/NetLoop.Android/bin/Release/net10.0-android36.0/android-arm64 -type f -name '*.apk' -print -quit)"
          fi
          test -n "$apk"
          cp "$apk" release/netloop-android-arm64.apk
          unzip -Z1 "$apk" | tee release/apk-contents.txt
          grep -q '^lib/arm64-v8a/libzt.so$' release/apk-contents.txt
          abis="$(awk -F/ '$1 == "lib" {print $2}' release/apk-contents.txt | sort -u | paste -sd, -)"
          test "$abis" = "arm64-v8a"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: release/netloop-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [metadata, windows, android]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && (!inputs.publish_windows || needs.windows.result == 'success') && (!inputs.publish_android || needs.android.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi
          ls -lh "${assets[@]}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --generate-notes --title "$RELEASE_TAG" --target "$GITHUB_SHA"
          fi
