name: C# Android CI

on:
  push:
    branches:
      - main
      - "gpt/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: csharp-android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: "libzt-netloop-csharp-android-v1"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  build:
    name: Build C# Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET Android workload
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          workloads: android

      - name: Resolve Android native cache key
        id: native-key
        shell: bash
        run: |
          set -euo pipefail
          ndk_revision="$(awk -F= '/Pkg.Revision/ {gsub(/ /, "", $2); print $2}' "$ANDROID_NDK_HOME/source.properties")"
          echo "ndk_revision=$ndk_revision" >> "$GITHUB_OUTPUT"
          fingerprint="$(python tools/native_cache_key.py --platform android --arch arm64-v8a --ndk-revision "$ndk_revision")"
          echo "key=libzt-pinvoke-android-arm64-${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Restore compiled Android libzt bundle
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native-cache/android-arm64
          key: ${{ steps.native-key.outputs.key }}

      - name: Set up sccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Build Android arm64-v8a libzt on cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: >
          python tools/build_android_native.py
          --ndk "$ANDROID_NDK_HOME"
          --api 24
          --abi arm64-v8a
          --use-sccache
          --output native-cache/android-arm64/libzt.so

      - name: Verify Android native bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f native-cache/android-arm64/libzt.so
          file native-cache/android-arm64/libzt.so | tee native-cache/android-arm64/file.txt
          grep -Eq 'ARM aarch64|ARM64|AArch64' native-cache/android-arm64/file.txt
          test -f native-cache/android-arm64/libzt.so.manifest.json
          cat native-cache/android-arm64/libzt.so.manifest.json

      - name: Save compiled Android libzt bundle immediately
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-cache/android-arm64
          key: ${{ steps.native-key.outputs.key }}

      - name: Publish Android application
        run: >
          dotnet publish src-csharp/NetLoop.Android/NetLoop.Android.csproj
          --configuration Release
          --framework net10.0-android36.0
          --runtime android-arm64
          -p:LibztNativePath="$PWD/native-cache/android-arm64/libzt.so"
          -p:AndroidPackageFormat=apk

      - name: Verify APK architecture and native library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-android
          apk="$(find src-csharp/NetLoop.Android/bin/Release/net10.0-android36.0/android-arm64 -type f -name '*-Signed.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            apk="$(find src-csharp/NetLoop.Android/bin/Release/net10.0-android36.0/android-arm64 -type f -name '*.apk' -print -quit)"
          fi
          test -n "$apk"
          cp "$apk" dist-android/netloop-android-arm64.apk
          unzip -Z1 "$apk" | tee dist-android/apk-contents.txt
          grep -q '^lib/arm64-v8a/libzt.so$' dist-android/apk-contents.txt
          abis="$(awk -F/ '$1 == "lib" {print $2}' dist-android/apk-contents.txt | sort -u | paste -sd, -)"
          test "$abis" = "arm64-v8a"
          echo "APK_ABIS=$abis"

      - name: Upload Android arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: csharp-android-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-android/
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### C# Android arm64-v8a build"
            echo "- NDK: ${{ steps.native-key.outputs.ndk_revision }}"
            echo "- native bundle cache hit: ${{ steps.native-cache.outputs.cache-hit }}"
            if [[ -f native-cache/android-arm64/libzt.so.manifest.json ]]; then
              echo '~~~json'
              cat native-cache/android-arm64/libzt.so.manifest.json
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
